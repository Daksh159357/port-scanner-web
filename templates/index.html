<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCP Port Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b111b;color:#e5edf7;font:15px system-ui,sans-serif}
main{max-width:1000px;margin:35px auto;padding:20px}h1{color:#00e0ad;letter-spacing:2px}
.panel{background:#151f2d;border:1px solid #28374a;border-radius:14px;padding:20px;margin:18px 0}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}label{display:block;color:#aab8ca;margin-bottom:7px}
input:not([type=checkbox]){width:100%;padding:12px;background:#0b111b;color:white;border:1px solid #34465b;border-radius:7px}
button,.export{padding:12px 17px;border:0;border-radius:7px;cursor:pointer;font-weight:bold;text-decoration:none;display:inline-block}
.start{background:#00e0ad;color:#061710}.stop{background:#d94b60;color:white}.export{background:#29394d;color:white}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.muted{color:#9aaabd}
.track{height:12px;background:#29394d;border-radius:8px;overflow:hidden;margin:14px 0}#bar{height:100%;width:0;background:#00e0ad;transition:width .15s}
.stats{display:flex;gap:30px;flex-wrap:wrap}.stats strong{display:block;color:#00e0ad;font-size:22px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #29394d}th{color:#00e0ad}td:nth-child(2){color:#00e0ad}
@media(max-width:650px){.fields{grid-template-columns:1fr}main{padding:12px}}
</style></head>
<body><main>
<h1>PORT SCANNER</h1><p class="muted">TCP CONNECT SCANNER · PORTS 0–65535</p>
<section class="panel">
<div class="fields">
<div><label for="target">Target public IP / hostname</label><input id="target" placeholder="Authorized public IP or hostname"></div>
<div><label for="timeout">Timeout (seconds)</label><input id="timeout" type="number" value="0.3" min="0.1" max="3" step="0.1"></div>
<div><label for="workers">Concurrency</label><input id="workers" type="number" value="100" min="10" max="300"></div>
</div>
<p><label><input id="authorized" type="checkbox"> I own this target or have permission to scan it.</label></p>
<div class="actions"><button class="start" id="start">START SCAN</button><button class="stop" id="stop">STOP</button><a class="export" href="/api/export">EXPORT CSV</a>
<form method="post" action="/logout" style="margin-left:auto"><button class="export">LOG OUT</button></form></div>
<p id="message" class="muted">Ready</p><div class="track"><div id="bar"></div></div>
<div class="stats"><div>Progress<strong id="progress">0%</strong></div><div>Open ports<strong id="count">0</strong></div><div>Elapsed<strong id="elapsed">0.0 s</strong></div></div>
</section>
<section class="panel"><h2>Open ports</h2><p class="muted" id="targetLabel">No scan started</p>
<table><thead><tr><th>Port</th><th>State</th><th>TCP service</th></tr></thead><tbody id="results"><tr><td colspan="3">No results yet</td></tr></tbody></table></section>
<p class="muted">Only scan systems you are authorized to test. Scans originate from Render, not your laptop or private LAN.</p>
</main>
<script>
const $=id=>document.getElementById(id);let timer=null;
async function api(url,options={}){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
$("start").onclick=async()=>{if(!$("authorized").checked){$("message").textContent="Confirm authorization first.";return;}
try{const d=await api("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:$("target").value,timeout:$("timeout").value,workers:$("workers").value,authorized:$("authorized").checked})});
$("message").textContent=d.message;$("targetLabel").textContent="Target: "+d.target;$("results").innerHTML="";if(timer)clearInterval(timer);timer=setInterval(refresh,700);refresh();
}catch(e){$("message").textContent=e.message;}};
$("stop").onclick=async()=>{try{await api("/api/stop",{method:"POST"});$("message").textContent="Stopping scan...";}catch(e){$("message").textContent=e.message;}};
const services={21:"FTP",22:"SSH",25:"SMTP",53:"DNS",80:"HTTP",110:"POP3",143:"IMAP",443:"HTTPS",445:"SMB",3306:"MySQL",3389:"RDP",5432:"PostgreSQL",6379:"Redis",8080:"HTTP alternate",27017:"MongoDB"};
async function refresh(){try{const s=await api("/api/status");const pct=s.total?s.completed/s.total*100:0;
$("bar").style.width=pct+"%";$("progress").textContent=pct.toFixed(1)+"%";$("count").textContent=s.open_ports.length;$("elapsed").textContent=s.elapsed+" s";
$("results").innerHTML=s.open_ports.length?s.open_ports.map(p=>`<tr><td>${p}</td><td>OPEN</td><td>${services[p]||"Unknown"}</td></tr>`).join(""):'<tr><td colspan="3">No open ports found yet</td></tr>';
if(s.error)$("message").textContent=s.error;else if(!s.running){$("message").textContent=s.completed>=s.total?"Scan completed":"Scan stopped or ready";clearInterval(timer);timer=null;}else $("message").textContent="Scanning...";
}catch(e){$("message").textContent=e.message;}}
</script></body></html>
