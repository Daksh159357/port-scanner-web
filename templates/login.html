<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner Login</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b111b;color:#e5edf7;font:16px system-ui}
main{width:min(420px,92vw);padding:28px;background:#151f2d;border:1px solid #28374a;border-radius:14px}
h1{color:#00e0ad}label{display:block;margin:18px 0 7px;color:#aab8ca}
input{width:100%;padding:12px;background:#0b111b;color:white;border:1px solid #34465b;border-radius:7px}
button{margin-top:16px;padding:12px 17px;border:0;border-radius:7px;background:#00e0ad;font-weight:bold;cursor:pointer}
.error{color:#ff7d8c}
</style></head><body><main><h1>PORT SCANNER</h1><p>Sign in to access the scanner.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><label for="password">Access password</label><input id="password" name="password" type="password" required autofocus><button type="submit">SIGN IN</button></form></main></body></html>
