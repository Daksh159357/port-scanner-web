services:
  - type: web
    name: port-scanner-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SCANNER_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
